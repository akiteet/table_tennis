<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>斯诺克台球 3D - 联机对战</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(12, 12, 12, 0.92);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .nav-title {
            font-size: 18px;
            font-weight: 700;
            color: #e6d2ad;
        }
        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 14px;
            border-radius: 6px;
            border: 1px solid rgba(212, 165, 116, 0.42);
            color: #e8d8bc;
            text-decoration: none;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.04);
        }
        .nav-link.active,
        .nav-link:hover {
            background: rgba(212, 165, 116, 0.18);
            border-color: rgba(212, 165, 116, 0.78);
            color: #fff;
        }
        .app-shell {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }
        canvas {
            border: 4px solid #5a3a22;
            background: #111;
            cursor: crosshair;
            display: block;
        }
        .panel {
            padding: 15px;
            background: linear-gradient(180deg, rgba(50, 30, 15, 0.8), rgba(30, 20, 10, 0.9));
            border-radius: 15px;
            border: 2px solid #5a3a22;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            height: 100%; /* 填充父容器高度 */
            display: flex;
            flex-direction: column;
        }
        .info {
            display: flex;
            gap: 15px;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tips {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
        }
        button {
            margin: 8px;
            padding: 12px 32px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(180deg, #6b4423, #4a2f15);
            color: white;
            border: 2px solid #8a5a33;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }
        button:hover {
            background: linear-gradient(180deg, #7a5a33, #5a3f25);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            transform: translateY(-1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .message {
            margin-top: 10px;
            font-size: 16px;
            color: #ff0;
            min-height: 22px;
        }

        /* 纵向力度仪表盘 */
        .power-gauge-container {
            width: 45px;
            height: 240px;
            background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
            border-radius: 12px;
            padding: 5px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 2px solid #444;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
        }
        .power-gauge {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #00ff66, #66ff00, #ffff00, #ff9900, #ff3300);
            border-radius: 6px;
            transition: none;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.2);
        }
        .power-label {
            text-align: center;
            margin-top: 12px;
            font-size: 16px;
            color: #d4a574;
            font-weight: 500;
        }
        .gauge-marker {
            position: absolute;
            left: 0;
            width: 100%;
            text-align: right;
            padding-right: 8px;
            font-size: 11px;
            color: #888;
            font-weight: 500;
        }

        /* 圆形方向控制 */
        .direction-control {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            position: relative;
            margin: 15px auto;
            cursor: crosshair;
            border: 3px solid #555;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.05);
        }
        .direction-control::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 180px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed #444;
        }
        .direction-control::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            height: 140px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed #333;
        }
        .direction-handle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #66ccff, #0088cc);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.6);
        }
        .direction-center {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fff, #ccc);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .direction-label {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            color: #aaa;
        }
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 380px; /* 引导线移出后进一步压缩 */
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #d4a574;
            text-align: center;
            margin-bottom: 10px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .stat-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #e0d0b0;
        }
        .stat-value.highlight {
            color: #ffcc00;
        }
        .stat-value.danger {
            color: #ff6644;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            margin: 2px;
            background: linear-gradient(180deg, #4a4a4a, #2a2a2a);
            border: 1px solid #555;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-sm:hover {
            background: linear-gradient(180deg, #5a5a5a, #3a3a3a);
            border-color: #777;
            color: #fff;
        }
        .btn-sm.active {
            background: linear-gradient(180deg, #6b4423, #4a2f15);
            border-color: #8a5a33;
            color: #fff;
            box-shadow: 0 0 8px rgba(180, 120, 60, 0.4);
        }
        .btn-action {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            margin: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-shoot {
            background: linear-gradient(180deg, #c0392b, #8b0000);
            border: 2px solid #e74c3c;
            color: #fff;
            box-shadow: 0 4px 12px rgba(200, 0, 0, 0.3);
        }
        .btn-shoot:hover {
            background: linear-gradient(180deg, #e74c3c, #a00000);
            box-shadow: 0 6px 16px rgba(220, 0, 0, 0.4);
            transform: translateY(-1px);
        }
        .btn-reset {
            background: linear-gradient(180deg, #4a4a4a, #2a2a2a);
            border: 2px solid #666;
            color: #ccc;
        }
        .btn-reset:hover {
            background: linear-gradient(180deg, #5a5a5a, #3a3a3a);
            border-color: #888;
            color: #fff;
            transform: translateY(-1px);
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 12px 0;
        }

        .let-play-banner {
            background: linear-gradient(135deg, rgba(200, 150, 0, 0.15), rgba(200, 100, 0, 0.1));
            border: 1px solid rgba(200, 150, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .message {
            margin-top: 8px;
            font-size: 14px;
            color: #ff0;
            min-height: 20px;
            flex-shrink: 0;
        }
        .let-play-banner {
            background: linear-gradient(135deg, rgba(200, 150, 0, 0.15), rgba(200, 100, 0, 0.1));
            border: 1px solid rgba(200, 150, 0, 0.3);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1000;
            width: min(420px, calc(100vw - 48px));
            background-color: rgba(36, 24, 8, 0.96);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
        }
        .let-play-banner .title {
            font-size: 13px;
            font-weight: 600;
            color: #ffcc00;
            margin-bottom: 6px;
        }

        /* 新布局样式 */
        .info-layout {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex: 1;
            min-height: 0;
        }
        .left-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 110px;
        }
        .guide-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }
        .scoreboard-slim {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 110px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px;
        }
        .player-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .player-score.active {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .player-label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .score-value {
            font-size: 22px;
            font-weight: 700;
            color: #e0d0b0;
            line-height: 1.2;
        }
        .break-value {
            font-size: 10px;
            color: #888;
            margin-top: 1px;
        }
        .operations-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }
        .game-status {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
        }
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }
        .status-label {
            color: #aaa;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .status-value {
            font-weight: 600;
            color: #e0d0b0;
        }
        .status-value.highlight {
            color: #ffcc00;
        }
        .status-value.danger {
            color: #ff6644;
        }
        .operation-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px;
        }
        .section-label {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-sm:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .spin-control {
            width: 132px;
            height: 132px;
            margin: 12px auto 8px;
            border-radius: 50%;
            position: relative;
            cursor: crosshair;
            touch-action: none;
            border: 3px solid #777;
            background: radial-gradient(circle at 35% 30%, #fff 0%, #e4e4e4 45%, #b7b7b7 100%);
            box-shadow: inset -8px -10px 18px rgba(0, 0, 0, 0.22), 0 5px 14px rgba(0, 0, 0, 0.4);
        }
        .spin-control::before,
        .spin-control::after {
            content: '';
            position: absolute;
            background: rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }
        .spin-control::before {
            width: 1px;
            height: 92%;
            left: 50%;
            top: 4%;
        }
        .spin-control::after {
            width: 92%;
            height: 1px;
            left: 4%;
            top: 50%;
        }
        .spin-handle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #c62828;
            border: 2px solid #fff;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.45);
            pointer-events: none;
        }
        .spin-axis-label {
            position: absolute;
            color: #222;
            font-size: 11px;
            font-weight: 700;
            pointer-events: none;
        }
        .spin-axis-label.top { top: 5px; left: 50%; transform: translateX(-50%); }
        .spin-axis-label.bottom { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .spin-axis-label.left { left: 5px; top: 50%; transform: translateY(-50%); }
        .spin-axis-label.right { right: 5px; top: 50%; transform: translateY(-50%); }
        .spin-value {
            min-height: 18px;
            color: #d4a574;
            font-size: 12px;
            text-align: center;
        }
        .btn-color {
            min-width: 46px;
            padding: 6px 8px;
        }

        .online-bar {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) auto auto;
            gap: 10px;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(24, 24, 24, 0.92);
        }
        .online-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .online-field label {
            color: #c9b99e;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .online-field input {
            min-height: 34px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(212, 165, 116, 0.45);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            outline: none;
        }
        .online-status {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            color: #d5c8b5;
            font-size: 13px;
        }
        .online-pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 9px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }
        @media (max-width: 900px) {
            .online-bar {
                grid-template-columns: 1fr;
            }
        }

        /* 紧凑型桌面布局：保持球台画布固有比例，减少页面纵向占用。 */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            font-size: 15px;
        }
        .top-nav {
            padding: 9px 16px;
        }
        .nav-title {
            font-size: 20px;
        }
        .nav-link {
            min-height: 32px;
            padding: 0 12px;
            font-size: 14px;
        }
        .online-bar {
            grid-template-columns: minmax(190px, 1fr) minmax(150px, 0.7fr) auto auto;

        }
        .online-field label {
            font-size: 12px;

        }

            flex: 1 1 auto; min-width: 0; min-height: 0;
            width: 100%; height: 100%;
            aspect-ratio: 16 / 9;   /* 父级高度为 auto 时（斯诺克的网格布局）靠它撑出高度；父级定高时不生效 */

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let SCALE, TABLE_INNER_LENGTH, TABLE_INNER_WIDTH, BORDER, TABLE_WIDTH, TABLE_HEIGHT;
        let BALL_RADIUS, FRICTION, HOLE_RADIUS, BALL_DIAMETER, BAULK_DISTANCE, D_ZONE_RADIUS;
        let CUSHION_WIDTH, RAIL_WIDTH, RAIL_3D_WIDTH;

        let COLOR_BALLS_DEF, holes;
        let cushionPieces = [];
        let cushionSegments = [];

        // 游戏状态变量
        let balls = [];
        let whiteBall = null;
        let scores = [0, 0];
        let currentPlayer = 0;
        let currentBreak = 0;
        let phase = 'red';
        let pottedThisShot = [];
        let foul = false;
        let foulType = '';
        let isPlacingBall = false;
        let ballMoving = false;
        let gameStarted = false;
        let allBallsStopped = true;
        let redBallPottedThisVisit = 0;
        let colorBallPottedThisVisit = null;
        let firstBallHit = null;
        let shotStarted = false;
        let freeBallMode = false;
        let freeBallTarget = null;
        let awaitingLetPlayDecision = false;
        let foulDecisionPlayer = null;
        let lastFoulPenalty = 0;
        let nominatedColor = null;
        let shotSnapshot = null;
        let shotContext = null;
        let lastFoulWasMiss = false;
        let frameStarter = 0;
        let nextBallId = 1;
        let lastMessage = '';
        let currentShotReplay = [];
        let lastShotReplay = [];
        let replayRestoreFrame = null;
        let replayRestoreMessage = '';
        let isReplaying = false;
        let replayFrameIndex = 0;
        let replayLastFrameAt = 0;
        let replayCaptureCounter = 0;

        // 联机状态变量
        const ONLINE_MODE = true;
        let socket = null;
        let onlineConnected = false;
        let onlineRoomId = '';
        let myPlayer = null;
        let onlineClientId = null;
        let applyingRemoteState = false;
        let shotAuthorityPlayer = null;
        let lastStateBroadcastAt = 0;
        let remoteMotionTargets = null;
        const REMOTE_MOTION_SMOOTHING = 0.45;
        const REMOTE_MOTION_SNAP_DISTANCE = 80;

        // 球杆系统变量
        let cueAngle = 0;
        let cuePower = 0;
        let cueSpinX = 0;
        let cueSpinY = 0;
        let activeShotSpinX = 0;
        let activeShotSpinY = 0;
        let activeShotAngle = 0;
        let activeShotSpeed = 0;
        let shotSpinApplied = false;
        let directionControlActive = false;
        let powerControlActive = false;
        let spinControlActive = false;

        // 引导线系统变量
        let guideMode = 'short';
        const STOP_SPEED = 0.08;
        const BASE_SHOT_SPEED = 12;
        const HIGH_POWER_BOOST = 4;
        const CUSHION_RESTITUTION = 0.82;
        const POCKET_JAW_RADIUS = 8;            // 中袋库边鼻端圆角（袋嘴）半径；须小于库边宽，否则圆弧终点与端面点重合成零长碰撞边
        const POCKET_CORNER_JAW_RADIUS = 4;     // 角袋库边鼻端凸圆角半径（按 snooker.jpg 袋口宽 85mm 取）；圆角同时与鼻子线、洞圆相切
        const TOP_SPIN_STRENGTH = 0.42;
        const SIDE_SPIN_CUSHION_STRENGTH = 0.24;
        const SIDE_SPIN_DECAY = 0.992;
        const REPLAY_FRAME_DURATION = 32;
        const REPLAY_CAPTURE_INTERVAL = 2;
        let audioContext = null;
        let lastBallSoundAt = 0;
        let lastCushionSoundAt = 0;

        function getShotSpeed(powerPercent) {
            const power = Math.max(0, Math.min(100, powerPercent)) / 100;
            return power * (BASE_SHOT_SPEED + HIGH_POWER_BOOST * power);
        }

        function getGameAudioContext() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;
            if (!audioContext) audioContext = new AudioContextClass();
            if (audioContext.state === 'suspended') audioContext.resume();
            return audioContext;
        }

        function playTone(frequency, endFrequency, duration, volume, type = 'sine') {
            const audio = getGameAudioContext();
            if (!audio) return;

            const now = audio.currentTime;
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(Math.max(20, frequency), now);
            oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), now + duration);
            gain.gain.setValueAtTime(Math.max(0.0001, volume), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            oscillator.connect(gain);
            gain.connect(audio.destination);
            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        function broadcastSoundEvent(sound, intensity = 0, detail = '') {
            if (!onlineConnected || !socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({
                type: 'sound',
                sound,
                intensity: Number(intensity) || 0,
                detail
            }));
        }

        function playCueStrikeSound(powerPercent, syncOnline = true) {
            const strength = Math.max(0.15, Math.min(1, powerPercent / 100));
            playTone(420, 190, 0.032, 0.045 + strength * 0.075, 'triangle');
            playTone(2400, 1250, 0.012, 0.018 + strength * 0.028, 'sine');
            if (syncOnline) broadcastSoundEvent('cue', powerPercent);
        }

        function playBallCollisionSound(impactSpeed, syncOnline = true) {
            if (impactSpeed < 0.18) return;
            const now = performance.now();
            if (now - lastBallSoundAt < 12) return;
            lastBallSoundAt = now;
            const strength = Math.min(1, impactSpeed / BASE_SHOT_SPEED);
            playTone(1750 + strength * 520, 980, 0.018, 0.03 + strength * 0.075, 'sine');
            playTone(3100, 1800, 0.008, 0.008 + strength * 0.018, 'triangle');
            if (syncOnline) broadcastSoundEvent('ball', impactSpeed);
        }

        function playCushionSound(impactSpeed, syncOnline = true) {
            if (impactSpeed < 0.25) return;
            const now = performance.now();
            if (now - lastCushionSoundAt < 18) return;
            lastCushionSoundAt = now;
            const strength = Math.min(1, impactSpeed / BASE_SHOT_SPEED);
            playTone(520, 245, 0.034, 0.018 + strength * 0.048, 'triangle');
            playTone(1350, 720, 0.012, 0.008 + strength * 0.016, 'sine');
            if (syncOnline) broadcastSoundEvent('cushion', impactSpeed);
        }

        function playPocketSound(ballOrType, syncOnline = true) {
            const ballType = typeof ballOrType === 'string' ? ballOrType : ballOrType.type;
            const pitch = ballType === 'white' ? 115 : 145;
            playTone(pitch, 55, 0.16, 0.085, 'sine');
            playTone(820, 280, 0.045, 0.032, 'triangle');
            if (syncOnline) broadcastSoundEvent('pocket', 1, ballType);
        }

        function playRemoteSound(message) {
            if (message.sound === 'cue') playCueStrikeSound(message.intensity, false);
            if (message.sound === 'ball') playBallCollisionSound(message.intensity, false);
            if (message.sound === 'cushion') playCushionSound(message.intensity, false);
            if (message.sound === 'pocket') playPocketSound(message.detail || 'color', false);
        }

        function setGuideMode(mode) {
            guideMode = mode;
            document.getElementById('guideOff').className = 'btn-sm' + (mode === 'off' ? ' active' : '');
            document.getElementById('guideLong').className = 'btn-sm' + (mode === 'long' ? ' active' : '');
            document.getElementById('guideShort').className = 'btn-sm' + (mode === 'short' ? ' active' : '');
        }





        function initOnlineUI() {
            const serverInput = document.getElementById('serverUrl');
            const roomInput = document.getElementById('roomId');
            const params = new URLSearchParams(window.location.search);
            const defaultServer = getDefaultServerUrl();
            serverInput.value = params.get('server') || defaultServer;
            roomInput.value = params.get('room') || makeRoomId();
            updateOnlineStatus('未连接');
            updateOnlineTurnStatus();
        }

        function getDefaultServerUrl() {
            if (location.protocol === 'http:' || location.protocol === 'https:') {
                if (!location.hostname.endsWith('github.io')) {
                    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    return `${protocol}//${location.host}`;
                }
                return 'wss://snooker-ovzx.onrender.com';
            }
            return 'ws://localhost:3000';
        }

        function makeRoomId() {
            return 'room-' + Math.random().toString(36).slice(2, 8);
        }

        function connectOnline() {
            getGameAudioContext();
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const roomId = document.getElementById('roomId').value.trim();
            if (!serverUrl || !roomId) {
                updateOnlineStatus('请填写服务器和房间号');
                return;
            }
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            onlineRoomId = roomId;
            updateOnlineStatus('连接中...');
            socket = new WebSocket(serverUrl);

            socket.addEventListener('open', () => {
                socket.send(JSON.stringify({ type: 'join', roomId }));
            });

            socket.addEventListener('message', (event) => {
                let message;
                try {
                    message = JSON.parse(event.data);
                } catch (error) {
                    return;
                }
                handleOnlineMessage(message);
            });

            socket.addEventListener('close', () => {
                onlineConnected = false;
                myPlayer = null;
                updateOnlineStatus('连接已断开');
                updateOnlineTurnStatus();
                updateUI();
            });

            socket.addEventListener('error', () => {
                updateOnlineStatus('连接失败，请检查服务器地址');
            });
        }

        function handleOnlineMessage(message) {
            if (message.type === 'sound') {
                playRemoteSound(message);
                return;
            }
            if (message.type === 'joined') {
                onlineConnected = true;
                onlineClientId = message.clientId;
                myPlayer = message.player;
                updateOnlineStatus('已连接');
                updateOnlineRole(message.player);
                updateOnlineRoom(message.roomId, message.clients);
                if (message.state) {
                    applyRemoteState(message.state);
                } else if (myPlayer === 0) {
                    broadcastState('initial-state');
                }
                updateUI();
                return;
            }

            if (message.type === 'room-update') {
                updateOnlineRoom(message.roomId, message.clients);
                if (message.notice) showMessage(message.notice);
                return;
            }

            if (message.type === 'state') {
                if (message.reason === 'shot-update' && message.state && message.state.partial === 'motion') {
                    applyMotionState(message.state);
                    captureRemoteReplayFrame(message.state);
                } else {
                    if (message.reason === 'shot-result') {
                        finalizeShotReplayCapture();
                    }
                    applyRemoteState(message.state);
                    if (message.reason === 'shot-start') {
                        startShotReplayCapture();
                    }
                }
                return;
            }

            if (message.type === 'error') {
                updateOnlineStatus(message.message || '服务器错误');
            }
        }

        function updateOnlineStatus(text) {
            const el = document.getElementById('connectionStatus');
            if (el) el.textContent = text;
        }

        function updateOnlineRole(player) {
            const role = document.getElementById('playerRole');
            if (!role) return;
            if (player === 0) role.textContent = '身份：玩家1';
            else if (player === 1) role.textContent = '身份：玩家2';
            else role.textContent = '身份：观战';
        }

        function updateOnlineRoom(roomId, clients = 0) {
            const room = document.getElementById('roomStatus');
            if (room) room.textContent = `房间：${roomId || '-'}（${clients}人）`;
        }

        function updateOnlineTurnStatus() {
            const turn = document.getElementById('turnStatus');
            if (!turn) return;
            if (!onlineConnected) {
                turn.textContent = '回合：未连接';
            } else if (myPlayer === currentPlayer) {
                turn.textContent = `回合：你（玩家${currentPlayer + 1}）`;
            } else {
                turn.textContent = `回合：玩家${currentPlayer + 1}`;
            }
        }

        function canControlCurrentTurn() {
            return onlineConnected && myPlayer === currentPlayer && myPlayer !== null && myPlayer < 2;
        }

        function canResolveFoulDecision() {
            const decisionPlayer = foulDecisionPlayer ?? (awaitingLetPlayDecision ? 1 - currentPlayer : null);
            return onlineConnected && awaitingLetPlayDecision && myPlayer === decisionPlayer;
        }

        function canResetOnlineGame() {
            return onlineConnected && myPlayer === 0 && !isTableInMotion();
        }

        function getWaitMessage() {
            if (!onlineConnected) return '请先连接联机房间';
            if (myPlayer === null || myPlayer > 1) return '当前为观战模式';
            return `等待玩家${currentPlayer + 1}操作`;
        }

        function shouldSimulateTable() {
            return !ONLINE_MODE || !onlineConnected || myPlayer === shotAuthorityPlayer;
        }

        function maybeBroadcastMovingState() {
            if (!onlineConnected || myPlayer !== shotAuthorityPlayer) return;
            const now = Date.now();
            if (now - lastStateBroadcastAt < 50) return;
            broadcastMotionState('shot-update');
        }

        function broadcastState(reason) {
            if (!onlineConnected || applyingRemoteState || !socket || socket.readyState !== WebSocket.OPEN) return;
            lastStateBroadcastAt = Date.now();
            socket.send(JSON.stringify({
                type: 'state',
                reason,
                state: serializeGameState()
            }));
        }

        function broadcastMotionState(reason) {
            if (!onlineConnected || applyingRemoteState || !socket || socket.readyState !== WebSocket.OPEN) return;
            lastStateBroadcastAt = Date.now();
            socket.send(JSON.stringify({
                type: 'state',
                reason,
                state: serializeMotionState()
            }));
        }

        function serializeGameState() {
            return {
                nextBallId,
                balls: balls.map(ball => ({
                    id: ball.id,
                    x: ball.x,
                    y: ball.y,
                    vx: ball.vx,
                    vy: ball.vy,
                    sideSpin: ball.sideSpin || 0,
                    color: ball.color,
                    type: ball.type,
                    points: ball.points,
                    name: ball.name,
                    defaultX: ball.defaultX,
                    defaultY: ball.defaultY
                })),
                scores: [...scores],
                currentPlayer,
                currentBreak,
                phase,
                isPlacingBall,
                ballMoving,
                gameStarted,
                allBallsStopped,
                freeBallMode,
                freeBallTargetId: freeBallTarget ? freeBallTarget.id : null,
                awaitingLetPlayDecision,
                foulDecisionPlayer,

                nominatedColorId: nominatedColor ? nominatedColor.id : null,
                lastFoulWasMiss,

        }

        function serializeMotionState() {
            return {
                partial: 'motion',
                balls: balls.map(ball => ({
                    id: ball.id,
                    x: ball.x,
                    y: ball.y,
                    vx: ball.vx,
                    vy: ball.vy
                })),
                ballMoving,
                allBallsStopped,
                shotAuthorityPlayer,
                message: lastMessage
            };
        }

        function applyMotionState(state) {
            if (!state || !Array.isArray(state.balls)) return;
            applyingRemoteState = true;

            const incoming = new Map(state.balls.map(ball => [ball.id, ball]));
            balls = balls.filter(ball => incoming.has(ball.id));
            for (const ball of balls) {
                const data = incoming.get(ball.id);
                ball.vx = data.vx || 0;
                ball.vy = data.vy || 0;
            }
            remoteMotionTargets = incoming;
            whiteBall = balls.find(ball => ball.type === 'white') || null;
            ballMoving = !!state.ballMoving;
            allBallsStopped = !!state.allBallsStopped;
            shotAuthorityPlayer = state.shotAuthorityPlayer;
            if (state.message) {
                showMessage(state.message);
            }

            applyingRemoteState = false;
        }

        function smoothRemoteMotion() {
            if (!remoteMotionTargets || shouldSimulateTable()) return;

            let settled = true;
            for (const ball of balls) {
                const target = remoteMotionTargets.get(ball.id);
                if (!target) continue;

                const dx = target.x - ball.x;
                const dy = target.y - ball.y;
                const distance = Math.hypot(dx, dy);

                if (distance > REMOTE_MOTION_SNAP_DISTANCE) {
                    ball.x = target.x;
                    ball.y = target.y;
                } else {
                    ball.x += dx * REMOTE_MOTION_SMOOTHING;
                    ball.y += dy * REMOTE_MOTION_SMOOTHING;
                }

                ball.vx = target.vx || 0;
                ball.vy = target.vy || 0;
                if (distance > 0.35) settled = false;
            }

            if (!ballMoving && settled) {
                remoteMotionTargets = null;
            }
        }

        function applyRemoteState(state) {
            if (!state) return;
            applyingRemoteState = true;
            remoteMotionTargets = null;
            nextBallId = state.nextBallId || 1;
            balls = (state.balls || []).map(data => {
                const ball = createBall(data.x, data.y, data.color, data.type, data.points);
                ball.id = data.id || ball.id;
                ball.vx = data.vx || 0;
                ball.vy = data.vy || 0;
                ball.sideSpin = data.sideSpin || 0;
                ball.name = data.name || '';
                ball.defaultX = data.defaultX;
                ball.defaultY = data.defaultY;
                return ball;
            });
            whiteBall = balls.find(ball => ball.type === 'white') || null;
            scores = Array.isArray(state.scores) ? [...state.scores] : [0, 0];
            currentPlayer = state.currentPlayer || 0;
            currentBreak = state.currentBreak || 0;
            phase = state.phase || 'red';
            isPlacingBall = !!state.isPlacingBall;
            ballMoving = !!state.ballMoving;
            gameStarted = !!state.gameStarted;
            allBallsStopped = !!state.allBallsStopped;
            freeBallMode = !!state.freeBallMode;
            awaitingLetPlayDecision = !!state.awaitingLetPlayDecision;
            foulDecisionPlayer = Number.isInteger(state.foulDecisionPlayer) ? state.foulDecisionPlayer : null;
            lastFoulPenalty = state.lastFoulPenalty || 0;
            lastFoulWasMiss = !!state.lastFoulWasMiss;
            shotSnapshot = state.shotSnapshot || null;
            frameStarter = state.frameStarter || 0;
            cueAngle = state.cueAngle || 0;
            cuePower = state.cuePower || 0;
            cueSpinX = Number.isFinite(state.cueSpinX) ? state.cueSpinX : 0;
            cueSpinY = Number.isFinite(state.cueSpinY) ? state.cueSpinY : 0;
            guideMode = state.guideMode || guideMode;
            shotAuthorityPlayer = state.shotAuthorityPlayer;
            freeBallTarget = state.freeBallTargetId ? balls.find(ball => ball.id === state.freeBallTargetId) || null : null;
            nominatedColor = state.nominatedColorId ? balls.find(ball => ball.id === state.nominatedColorId) || null : null;
            updatePowerGauge();
            updateDirectionHandle();
            updateAngleDisplay();
            updateSpinControl();
            setGuideMode(guideMode);
            updateUI();
            syncLetPlayPanel();
            showMessage(state.message || getWaitMessage());
            applyingRemoteState = false;
        }

        function copyInviteLink() {

        function initGameConstants() {
            SCALE = 0.2;
            TABLE_INNER_LENGTH = Math.round(3569 * SCALE);
            TABLE_INNER_WIDTH = Math.round(1778 * SCALE);

            BALL_RADIUS = Math.round(52.5 * SCALE / 2);
            FRICTION = 0.985;
            // 袋口取自斯诺克标准台示意图（_data/standard/snooker.jpg）：角袋库边端头凸圆角收口后贴着洞圆，中袋圆角袋嘴；
            // 洞半径 45mm（= 库边宽），角袋两侧圆角起点间距 ≈ 87mm（示意图标注袋口宽 85mm），木框 ≈ 80mm
            HOLE_RADIUS = Math.max(BALL_RADIUS + 4, Math.round(45 * SCALE));
            // 库边宽 = 洞半径：中袋洞心恰好落在库边外沿上、洞圆与绿呢边相切；
            // 角袋洞心在绿呢四角，洞圆恰好与长短两条库边的外沿同时相切
            CUSHION_WIDTH = HOLE_RADIUS;
            RAIL_WIDTH = HOLE_RADIUS + Math.round(10 * SCALE);   // 2D 木框只作示意：刚好包住伸进木框的中袋洞（洞心在库边外沿上）再留 2
            RAIL_3D_WIDTH = Math.round(80 * SCALE);   // 示意图实测的真实木框宽，仅 3D 实体木框使用
            BORDER = CUSHION_WIDTH + RAIL_WIDTH;         // 画布边 → 库边鼻子线（物理边界）
            TABLE_WIDTH = TABLE_INNER_LENGTH + BORDER * 2;
            TABLE_HEIGHT = TABLE_INNER_WIDTH + BORDER * 2;

            BALL_DIAMETER = BALL_RADIUS * 2;
            BAULK_DISTANCE = Math.round(737 * SCALE);
            D_ZONE_RADIUS = Math.round(292 * SCALE);

            BAULK_LINE_X = BORDER + BAULK_DISTANCE;
            D_ZONE_CENTER_X = BAULK_LINE_X;
            D_ZONE_CENTER_Y = TABLE_HEIGHT / 2;

            COLOR_BALLS_DEF = [
                { name: '黄球', color: '#FFD700', points: 2, defaultX: BAULK_LINE_X, defaultY: D_ZONE_CENTER_Y + D_ZONE_RADIUS },
                { name: '绿球', color: '#00CC00', points: 3, defaultX: BAULK_LINE_X, defaultY: D_ZONE_CENTER_Y - D_ZONE_RADIUS },
                { name: '棕球', color: '#8B4513', points: 4, defaultX: BAULK_LINE_X, defaultY: D_ZONE_CENTER_Y },
                { name: '蓝球', color: '#0066FF', points: 5, defaultX: BORDER + TABLE_INNER_LENGTH / 2, defaultY: TABLE_HEIGHT / 2 },
                { name: '粉球', color: '#FF69B4', points: 6, defaultX: BORDER + (TABLE_INNER_LENGTH / 2 + TABLE_INNER_LENGTH) / 2, defaultY: TABLE_HEIGHT / 2 },
                { name: '黑球', color: '#111111', points: 7, defaultX: BORDER + TABLE_INNER_LENGTH - Math.round(324 * SCALE), defaultY: TABLE_HEIGHT / 2 }
            ];

            const L = BORDER, R = TABLE_WIDTH - BORDER;   // 左右库边鼻子线
            const T = BORDER, B = TABLE_HEIGHT - BORDER;  // 上下库边鼻子线
            const midX = BORDER + TABLE_INNER_LENGTH / 2;
            holes = [
                { x: L, y: T },                          // 左上角袋：洞心在绿呢角上
                { x: midX, y: T - CUSHION_WIDTH },       // 上中袋：洞心在库边外沿上
                { x: R, y: T },                          // 右上角袋
                { x: L, y: B },                          // 左下角袋
                { x: midX, y: B + CUSHION_WIDTH },       // 下中袋
                { x: R, y: B }                           // 右下角袋
            ];
            buildCushionGeometry();
        }

        // 库边平面形状（逻辑坐标）：2D 绘制、物理碰撞、3D 建模共用这一份，三者不会对不上。
        // 长库边每条两段（角袋 → 中袋），短库边每条一段：
        //   角袋端 —— 斯诺克式圆角袋嘴（标准台示意图 snooker.jpg）：鼻子线 → 凸圆角（与鼻子线、洞圆都相切）
        //             → 沿洞圆的凹弧 → 库边外沿；洞心在台呢角上，洞半径 = 库边宽；
        //   中袋端 —— 鼻子线 → 圆角袋嘴 → 垂直端面，端面与中袋洞圆相切于库边外沿
        function buildCushionGeometry() {
            const c = CUSHION_WIDTH, r = HOLE_RADIUS, jaw = POCKET_JAW_RADIUS;
            const cj = POCKET_CORNER_JAW_RADIUS;
            const sj = Math.sqrt(r * r + 2 * r * cj);   // 角袋圆角圆心沿库边离台角的距离（圆角与洞圆外切）
            const th = Math.atan2(cj, sj);               // 圆角与洞圆切点的方向
            const L = BORDER, R = TABLE_WIDTH - BORDER;
            const T = BORDER, B = TABLE_HEIGHT - BORDER;
            const midX = BORDER + TABLE_INNER_LENGTH / 2;
            const arc = (cx, cy, rad, a0, a1, n) => {
                const pts = [];
                for (let i = 0; i <= n; i++) {
                    const a = a0 + (a1 - a0) * i / n;
                    pts.push({ x: cx + rad * Math.cos(a), y: cy + rad * Math.sin(a) });
                }
                return pts;
            };
            // 角袋端头点列，局部坐标 s = 沿库边离台角的距离、d = 离鼻子线往木框方向的深度；从库边外沿走到鼻子线
            // 贴洞弧用折线逼近：顶点外扩到 r / cos(半步角)，每条弦都外切洞圆，库边不侵入洞
            const cornerEnd = [
                ...arc(0, 0, r / Math.cos((Math.PI / 2 - th) / 20), Math.PI / 2, th, 10),
                ...arc(sj, cj, cj, th + Math.PI, Math.PI * 3 / 2, 8).slice(1)
            ].map(p => ({ s: p.x, d: p.y }));

            cushionPieces = [];
            // out：从鼻子线指向木框的方向（上 / 左为 -1，下 / 右为 +1）
            for (const [noseY, out] of [[T, -1], [B, 1]]) {
                for (const [cornerX, dir] of [[L, 1], [R, -1]]) {          // dir：从角袋指向中袋
                    const jawX = midX - dir * r;                            // 中袋端面所在 x
                    const pts = [
                        ...cornerEnd.map(p => ({ x: cornerX + dir * p.s, y: noseY + out * p.d })),   // 角袋圆角袋嘴
                        ...arc(jawX - dir * jaw, noseY + out * jaw, jaw,
                            -out * Math.PI / 2, dir > 0 ? 0 : -out * Math.PI, 12),
                        { x: jawX, y: noseY + out * c }
                    ];
                    cushionPieces.push({ pts, axis: 'y', nose: noseY, out });
                }
            }
            for (const [noseX, out] of [[L, -1], [R, 1]]) {
                const pts = [
                    ...cornerEnd.map(p => ({ x: noseX + out * p.d, y: T + p.s })),
                    ...cornerEnd.slice().reverse().map(p => ({ x: noseX + out * p.d, y: B - p.s }))
                ];
                cushionPieces.push({ pts, axis: 'x', nose: noseX, out });
            }

            // 碰撞线段 = 每块库边除背面（贴木框那条闭合边）以外的所有边
            cushionSegments = [];
            cushionPieces.forEach(({ pts }) => {
                for (let i = 0; i < pts.length - 1; i++) {
                    cushionSegments.push({ ax: pts[i].x, ay: pts[i].y, bx: pts[i + 1].x, by: pts[i + 1].y });
                }
            });
        }

        function initGame() {

            pottedThisShot = [];
            foul = false;
            foulType = '';
            isPlacingBall = true;
            ballMoving = false;
            gameStarted = false;
            allBallsStopped = true;
            freeBallMode = false;
            freeBallTarget = null;
            awaitingLetPlayDecision = false;
            foulDecisionPlayer = null;
            lastFoulPenalty = 0;
            nominatedColor = null;
            shotSnapshot = null;
            shotContext = null;
            lastFoulWasMiss = false;
            currentShotReplay = [];
            lastShotReplay = [];
            replayRestoreFrame = null;

        function createBall(x, y, color, type, points) {
            return { id: 'ball-' + nextBallId++, x, y, vx: 0, vy: 0, sideSpin: 0, color, type, points, name: '', defaultX: x, defaultY: y };
        }

        function getColorDefinition(name) {
            return COLOR_BALLS_DEF.find(cb => cb.name === name);
        }

        function getColorBall(name) {
            return balls.find(b => b.type === 'color' && b.name === name) || null;
        }

        function ballValue(ball) {
            if (!ball) return 0;
            return ball.type === 'red' ? 1 : ball.points;
        }

        function resetShotTracking() {
            pottedThisShot = [];
            foul = false;
            foulType = '';
            shotStarted = false;
            firstBallHit = null;
            shotContext = null;
        }

        function getBallsOnForRules() {
            if (phase === 'red') {
                return balls.filter(ball => ball.type === 'red');
            }
            if (phase === 'color') {
                return nominatedColor ? [nominatedColor] : [];
            }
            if (phase === 'final') {
                const nextColor = getNextFinalColor();
                return nextColor ? [nextColor] : [];
            }
            return [];
        }

        function getBallOnValueForRules() {
            if (phase === 'red') return 1;
            if (phase === 'color') return nominatedColor ? nominatedColor.points : 4;
            if (phase === 'final') {
                const nextColor = getNextFinalColor();
                return nextColor ? nextColor.points : 7;
            }
            return 4;
        }

        function describeBallsOn(context = null) {
            const ctx = context || captureShotContext();
            if (ctx.phase === 'red') return '红球';
            if (ctx.phase === 'color') return ctx.ballsOn[0] ? ctx.ballsOn[0].name : '指定彩球';
            if (ctx.phase === 'final') return ctx.ballsOn[0] ? ctx.ballsOn[0].name : '目标彩球';
            return '活球';
        }

        function captureShotContext() {
            const ballsOn = getBallsOnForRules();
            return {
                phase,
                ballsOn,
                ballOnValue: getBallOnValueForRules(),
                nominatedColor,
                freeBallMode,
                freeBallTarget,
                freeBallTargetName: freeBallTarget ? freeBallTarget.name : null
            };
        }

        function captureShotSnapshot() {
            return {
                balls: balls.map(ball => ({
                    x: ball.x,
                    y: ball.y,
                    vx: 0,
                    vy: 0,
                    color: ball.color,
                    type: ball.type,
                    points: ball.points,
                    name: ball.name,
                    defaultX: ball.defaultX,
                    defaultY: ball.defaultY,
                    id: ball.id,
                    isWhite: ball === whiteBall
                })),
                phase,
                nominatedColorName: nominatedColor ? nominatedColor.name : null,
                isPlacingBall
            };
        }

        function restoreShotSnapshot(snapshot) {
            if (!snapshot) return;
            balls = snapshot.balls.map(data => {
                const ball = createBall(data.x, data.y, data.color, data.type, data.points);
                ball.vx = 0;
                ball.vy = 0;
                ball.id = data.id || ball.id;
                ball.name = data.name;
                ball.defaultX = data.defaultX;
                ball.defaultY = data.defaultY;
                return ball;
            });
            whiteBall = balls.find(ball => ball.type === 'white') || null;
            phase = snapshot.phase;
            nominatedColor = snapshot.nominatedColorName ? getColorBall(snapshot.nominatedColorName) : null;
            isPlacingBall = snapshot.isPlacingBall;
            ballMoving = false;
            allBallsStopped = true;
        }

        function initControls() {
            const directionControl = document.getElementById('directionControl');
            const powerContainer = document.getElementById('powerContainer');
            const spinControl = document.getElementById('spinControl');

            // 方向控制
            directionControl.addEventListener('mousedown', (e) => {
                if (!canControlCurrentTurn() || isTableInMotion() || !gameStarted || awaitingLetPlayDecision) return;
                directionControlActive = true;
                updateDirectionFromControl(e);
            });
            document.addEventListener('mousemove', (e) => {
                if (directionControlActive) {
                    updateDirectionFromControl(e);
                }
                if (powerControlActive) {
                    updatePowerFromGauge(e);
                }
            });
            document.addEventListener('mouseup', () => {
                directionControlActive = false;
                powerControlActive = false;
            });

            spinControl.addEventListener('pointerdown', (e) => {
                if (!canControlCurrentTurn() || isTableInMotion() || !gameStarted || awaitingLetPlayDecision) return;
                spinControlActive = true;
                updateSpinFromControl(e);
                spinControl.setPointerCapture?.(e.pointerId);
            });
            document.addEventListener('pointermove', (e) => {
                if (spinControlActive) updateSpinFromControl(e);
            });
            document.addEventListener('pointerup', () => {
                if (spinControlActive) broadcastState('spin');
                spinControlActive = false;
            });

            // 纵向力度控制
            powerContainer.addEventListener('mousedown', (e) => {
                if (!canControlCurrentTurn() || isTableInMotion() || !gameStarted || awaitingLetPlayDecision) return;
                powerControlActive = true;
                updatePowerFromGauge(e);
            });

            // 键盘控制（微调）
            document.addEventListener('keydown', (e) => {
                if (e.key === '1') { setCameraMode('top'); return; }
                if (e.key === '2') { setCameraMode('orbit'); return; }
                if (e.key === '3') { setCameraMode('cue'); return; }
                if (!canControlCurrentTurn() || isTableInMotion() || !gameStarted || awaitingLetPlayDecision) return;
                const step = e.shiftKey ? 0.001745 : 0.01745;
                if (e.key === 'ArrowLeft') cueAngle -= step;
                if (e.key === 'ArrowRight') cueAngle += step;
                if (e.key === 'ArrowUp' && cuePower < 100) cuePower += 1;
                if (e.key === 'ArrowDown' && cuePower > 0) cuePower -= 1;
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    shoot();
                }
                updatePowerGauge();
                updateDirectionHandle();
                updateAngleDisplay();
            });
        }

        function updateDirectionFromControl(e) {
            const control = document.getElementById('directionControl');
            const rect = control.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            const newAngle = Math.atan2(dy, dx);

            const diff = newAngle - cueAngle;
            const normalizedDiff = Math.atan2(Math.sin(diff), Math.cos(diff));
            cueAngle = newAngle;
            updateDirectionHandle();
            updateAngleDisplay();
        }

        function updateAngleDisplay() {
            const angleDeg = (-cueAngle * 180 / Math.PI).toFixed(2);
            document.getElementById('angleDisplay').textContent = angleDeg + '°';
        }

        function updateDirectionHandle() {
            const handle = document.getElementById('directionHandle');
            const control = document.getElementById('directionControl');
            const radius = Math.max(0, (control.clientWidth || 200) / 2 - 15);
            const x = Math.cos(cueAngle) * radius;
            const y = Math.sin(cueAngle) * radius;
            handle.style.left = `calc(50% + ${x}px)`;
            handle.style.top = `calc(50% + ${y}px)`;
        }

        function updatePowerFromGauge(e) {
            const container = document.getElementById('powerContainer');
            const rect = container.getBoundingClientRect();
            const y = rect.bottom - e.clientY;
            const height = rect.height - 20;
            cuePower = Math.max(0, Math.min(100, (y / height) * 100));
            updatePowerGauge();
        }

        function updatePowerGauge() {
            document.getElementById('powerGauge').style.height = `${cuePower}%`;
            document.getElementById('powerLabel').textContent = Math.round(cuePower);
        }

        function updateSpinFromControl(e) {
            const control = document.getElementById('spinControl');
            const rect = control.getBoundingClientRect();
            const radius = Math.min(rect.width, rect.height) * 0.38;
            let dx = e.clientX - (rect.left + rect.width / 2);
            let dy = e.clientY - (rect.top + rect.height / 2);
            const distance = Math.hypot(dx, dy);
            if (distance > radius) {
                dx = dx / distance * radius;
                dy = dy / distance * radius;
            }
            cueSpinX = dx / radius;
            cueSpinY = -dy / radius;
            updateSpinControl();
        }

        function updateSpinControl() {
            const handle = document.getElementById('spinHandle');
            const value = document.getElementById('spinValue');
            if (!handle || !value) return;
            handle.style.left = `calc(50% + ${cueSpinX * 50}px)`;
            handle.style.top = `calc(50% - ${cueSpinY * 50}px)`;

            const labels = [];
            if (Math.abs(cueSpinY) >= 0.08) {
                labels.push(`${cueSpinY > 0 ? '高杆' : '低杆'} ${Math.round(Math.abs(cueSpinY) * 100)}%`);
            }
            if (Math.abs(cueSpinX) >= 0.08) {
                labels.push(`${cueSpinX > 0 ? '右塞' : '左塞'} ${Math.round(Math.abs(cueSpinX) * 100)}%`);
            }
            value.textContent = labels.length ? labels.join(' · ') : '中心击球';
        }

        function resetCueSpin() {
            if (!canControlCurrentTurn() || isTableInMotion() || awaitingLetPlayDecision) return;
            cueSpinX = 0;
            cueSpinY = 0;
            updateSpinControl();
            broadcastState('spin-reset');
        }

        function handleTableClick(mx, my) {
            // 3D 版：mx / my 由渲染层用射线求得的台面逻辑坐标直接传入（原 handleCanvasClick 去掉了屏幕坐标换算）


            if (isPlacingBall && !isTableInMotion() && !awaitingLetPlayDecision) {
                if (!canControlCurrentTurn()) {
                    showMessage(getWaitMessage());
                    return;
                }
                if (isValidBallPosition(mx, my)) {
                    whiteBall.x = mx;
                    whiteBall.y = my;
                    isPlacingBall = false;
                    gameStarted = true;
                    updateUI();
                    showMessage(`玩家${currentPlayer + 1}：调整方向和力度后点击"出杆"`);
                    broadcastState('cue-placement');
                } else {
                    showMessage('请将白球放置在蓝色D区内');
                }
                return;
            }

            if (!canControlCurrentTurn() || isTableInMotion() || !gameStarted || awaitingLetPlayDecision) return;

            if (freeBallMode && !freeBallTarget) {
                for (const ball of balls) {
                    if (ball.type !== 'white') {
                        const dx = ball.x - mx;
                        const dy = ball.y - my;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < BALL_RADIUS * 2) {
                            freeBallTarget = ball;
                            showMessage(`已选择自由球：${ball.name}，现在可以击打`);
                            updateUI();
                            broadcastState('free-ball-target');
                            return;
                        }
                    }
                }
                showMessage('请点击任意非白球作为自由球');
                return;
            }

            const dx = mx - whiteBall.x;
            const dy = my - whiteBall.y;
            cueAngle = Math.atan2(dy, dx);
            updateDirectionHandle();
            broadcastState('aim');
        }

        function shoot() {
            if (!canControlCurrentTurn()) {
                showMessage(getWaitMessage());
                return;
            }
            if (isTableInMotion() || !gameStarted || awaitingLetPlayDecision) return;
            if (isPlacingBall) {
                showMessage('请先在D区放置白球');
                return;
            }
            if (freeBallMode && freeBallTarget && freeBallTarget.type === 'white') {
                freeBallTarget = null;
                showMessage('自由球不能指定白球');
                return;
            }

            const speed = getShotSpeed(cuePower);

            shotSnapshot = captureShotSnapshot();
            shotContext = captureShotContext();
            startShotReplayCapture();
            activeShotSpinX = cueSpinX;
            activeShotSpinY = cueSpinY;
            activeShotAngle = cueAngle;
            activeShotSpeed = speed;
            shotSpinApplied = false;
            whiteBall.sideSpin = activeShotSpinX;
            cueSpinX = 0;
            cueSpinY = 0;
            updateSpinControl();
            whiteBall.vx = Math.cos(cueAngle) * speed;
            whiteBall.vy = Math.sin(cueAngle) * speed;
            playCueStrikeSound(cuePower);
            startCueStrikeAnim(cueAngle, cuePower);

            ballMoving = true;
            allBallsStopped = false;
            shotAuthorityPlayer = currentPlayer;
            remoteMotionTargets = null;
            shotStarted = true;
            firstBallHit = null;
            pottedThisShot = [];
            foul = false;

            document.getElementById('shootBtn').disabled = true;
            showMessage('击球中...');
            broadcastState('shot-start');
        }

        function nominateColor(name) {
            if (!canControlCurrentTurn()) {
                showMessage(getWaitMessage());
                return;
            }
            if (isTableInMotion() || awaitingLetPlayDecision || phase !== 'color' || freeBallMode) return;
            const ball = getColorBall(name);
            if (!ball) {
                showMessage(`${name}不在台面上，不能指定`);
                return;
            }
            nominatedColor = ball;
            showMessage(`已指定彩球：${name}`);
            updateUI();
            broadcastState('nominate-color');
        }

        function isInDZone(x, y) {
            if (x > BAULK_LINE_X) return false;
            if (x < BORDER + BALL_RADIUS) return false;
            if (y < BORDER + BALL_RADIUS) return false;
            if (y > TABLE_HEIGHT - BORDER - BALL_RADIUS) return false;
            if (holes.some(h => Math.hypot(x - h.x, y - h.y) < HOLE_RADIUS + BALL_RADIUS)) return false;

            const dx = x - D_ZONE_CENTER_X;
            const dy = y - TABLE_HEIGHT / 2;
            const dist = Math.sqrt(dx * dx + dy * dy);
            return dist <= D_ZONE_RADIUS - BALL_RADIUS;
        }

        function isValidBallPosition(x, y) {
            if (!isInDZone(x, y)) return false;

            for (let ball of balls) {
                if (ball === whiteBall) continue;
                const dx = x - ball.x;
                const dy = y - ball.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < BALL_RADIUS * 2.5) {
                    return false;
                }
            }
            return true;
        }

        function updateBalls() {
            balls.forEach(ball => {
                ball.vx *= FRICTION;
                ball.vy *= FRICTION;
                ball.sideSpin = (ball.sideSpin || 0) * SIDE_SPIN_DECAY;
            });

            const maxSpeed = balls.reduce((max, ball) => Math.max(max, Math.hypot(ball.vx, ball.vy)), 0);
            const substeps = Math.max(1, Math.min(8, Math.ceil(maxSpeed / Math.max(BALL_RADIUS * 0.75, 1))));

            for (let step = 0; step < substeps; step++) {
                const previousWhitePosition = whiteBall && balls.includes(whiteBall)
                    ? { x: whiteBall.x, y: whiteBall.y }
                    : null;

                balls.forEach(ball => {
                    ball.x += ball.vx / substeps;
                    ball.y += ball.vy / substeps;
                    resolveCushionCollision(ball);
                });

                if (previousWhitePosition && whiteBall && balls.includes(whiteBall)) {
                    detectFirstBallHitAlongWhitePath(previousWhitePosition.x, previousWhitePosition.y, whiteBall.x, whiteBall.y);
                }

                if (ballMoving) checkHoles();
                for (let i = 0; i < balls.length; i++) {
                    for (let j = i + 1; j < balls.length; j++) {
                        ballCollision(balls[i], balls[j]);
                    }
                }
            }

            captureShotReplayFrame();

            if (!isAnyBallMoving() && ballMoving) {
                stopAllBalls();
                ballMoving = false;
            }

            if (!ballMoving && !allBallsStopped) {
                allBallsStopped = true;
                finalizeShotReplayCapture();
                updateUI();
                processShotResult();
                broadcastState('shot-result');
                shotAuthorityPlayer = null;
            }
        }

        function resolveCushionCollision(ball) {
            // 库边 = buildCushionGeometry 生成的多边形边（鼻子线、中袋圆角袋嘴、端面、角袋斜切面），
            // 与 2D 绘制、3D 建模同源。球对每条边做圆-线段碰撞，碰到哪里就从哪里弹开：
            // 袋口处没有看不见的墙，球也不会穿进库边实体；袋口不再需要"让位窗口"
            const incomingVx = ball.vx;
            const incomingVy = ball.vy;
            let hit = false;
            let spinKick = 0;
            for (const s of cushionSegments) {
                const ex = s.bx - s.ax, ey = s.by - s.ay;
                const t = Math.max(0, Math.min(1, ((ball.x - s.ax) * ex + (ball.y - s.ay) * ey) / (ex * ex + ey * ey)));
                const px = s.ax + ex * t, py = s.ay + ey * t;
                const dist = Math.hypot(ball.x - px, ball.y - py);
                if (dist >= BALL_RADIUS || dist < 1e-9) continue;
                const nx = (ball.x - px) / dist, ny = (ball.y - py) / dist;   // 指向球的一侧
                ball.x = px + nx * BALL_RADIUS;
                ball.y = py + ny * BALL_RADIUS;
                const vn = ball.vx * nx + ball.vy * ny;
                if (vn >= 0) continue;                                       // 已经在离开
                ball.vx -= (1 + CUSHION_RESTITUTION) * vn * nx;              // 法向反弹并衰减，切向不变
                ball.vy -= (1 + CUSHION_RESTITUTION) * vn * ny;
                if (ball === whiteBall && Math.abs(ball.sideSpin || 0) > 0.001) {
                    // 侧旋吃库：沿切向 (ny, -nx) 加速，四面直库边上与原先逐面写法的符号一致
                    const k = ball.sideSpin * Math.abs(vn) * SIDE_SPIN_CUSHION_STRENGTH;
                    ball.vx += k * ny;
                    ball.vy -= k * nx;
                    spinKick++;
                }
                hit = true;
            }
            if (spinKick) ball.sideSpin *= 0.78;
            if (hit) {
                playCushionSound(Math.max(Math.abs(incomingVx), Math.abs(incomingVy)));
            }
        }

        function isAnyBallMoving() {
            return balls.some(ball => Math.hypot(ball.vx, ball.vy) > STOP_SPEED);
        }

        function isTableInMotion() {
            return isReplaying || ballMoving || !allBallsStopped || isAnyBallMoving();
        }

        function stopAllBalls() {
            balls.forEach(ball => {
                ball.vx = 0;
                ball.vy = 0;
            });
        }

        // 球心落进哪个洞圆就进哪个袋（球心下面已经没有台面）；
        // 兜底：球心越出库边外沿（正常碰撞下不会发生）也算进最近的袋，防止球卡在库边里
        function findPocketHole(ball) {
            let best = null, bestDist = Infinity;
            holes.forEach(h => {
                const d = Math.hypot(ball.x - h.x, ball.y - h.y);
                if (d < bestDist) { best = h; bestDist = d; }
            });
            if (bestDist < HOLE_RADIUS) return best;
            const outer = BORDER - CUSHION_WIDTH;
            const escaped = ball.x < outer || ball.x > TABLE_WIDTH - outer ||
                ball.y < outer || ball.y > TABLE_HEIGHT - outer;
            return escaped ? best : null;
        }

        function checkHoles() {
            const toRemove = [];
            balls.forEach(ball => {
                if (pottedThisShot.includes(ball)) return;
                const hole = findPocketHole(ball);
                if (!hole) return;
                pottedThisShot.push(ball);
                toRemove.push({ ball, hole });
                playPocketSound(ball);
            });
            balls = balls.filter(b => !toRemove.some(r => r.ball === b));
            toRemove.forEach(r => startPocketAnimation(r.ball, r.hole));
        }

        function captureReplayFrame(sourceBalls = balls) {
            return sourceBalls.map(ball => ({
                id: ball.id,
                x: ball.x,
                y: ball.y,
                color: ball.color,
                type: ball.type,
                points: ball.points,
                name: ball.name,
                defaultX: ball.defaultX,
                defaultY: ball.defaultY
            }));
        }

        function startShotReplayCapture() {
            currentShotReplay = [captureReplayFrame()];
            replayCaptureCounter = 0;
        }

        function captureShotReplayFrame(force = false) {
            if (currentShotReplay.length === 0) return;
            replayCaptureCounter++;
            if (!force && replayCaptureCounter % REPLAY_CAPTURE_INTERVAL !== 0) return;
            currentShotReplay.push(captureReplayFrame());
        }

        function captureRemoteReplayFrame(state) {
            if (!state || !Array.isArray(state.balls) || currentShotReplay.length === 0) return;
            replayCaptureCounter++;
            if (replayCaptureCounter % REPLAY_CAPTURE_INTERVAL !== 0) return;

            const incoming = new Map(state.balls.map(ball => [ball.id, ball]));
            const frame = balls
                .filter(ball => incoming.has(ball.id))
                .map(ball => {
                    const motion = incoming.get(ball.id);
                    return {
                        id: ball.id,
                        x: motion.x,
                        y: motion.y,
                        color: ball.color,
                        type: ball.type,
                        points: ball.points,
                        name: ball.name,
                        defaultX: ball.defaultX,
                        defaultY: ball.defaultY
                    };
                });
            currentShotReplay.push(frame);
        }

        function finalizeShotReplayCapture() {
            captureShotReplayFrame(true);
            if (currentShotReplay.length > 1) {
                lastShotReplay = currentShotReplay;
            }
            currentShotReplay = [];
            updateReplayButton();
        }

        function applyReplayFrame(frame) {
            balls = frame.map(data => ({
                id: data.id,
                x: data.x,
                y: data.y,
                vx: 0,
                vy: 0,
                color: data.color,
                type: data.type,
                points: data.points,
                name: data.name,
                defaultX: data.defaultX,
                defaultY: data.defaultY
            }));
            whiteBall = balls.find(ball => ball.type === 'white') || null;
        }

        function replayLastShot() {
            if (isReplaying || isTableInMotion() || lastShotReplay.length < 2) return;
            replayRestoreFrame = {
                balls,
                whiteBall,
                freeBallTarget,
                nominatedColor
            };
            replayRestoreMessage = lastMessage;
            isReplaying = true;
            replayFrameIndex = 0;
            replayLastFrameAt = 0;
            applyReplayFrame(lastShotReplay[0]);
            showMessage('精彩回放中...');
            updateReplayButton();
        }

        function updateReplayPlayback(timestamp) {
            if (!isReplaying) return;
            if (!replayLastFrameAt) {
                replayLastFrameAt = timestamp;
                return;
            }
            if (timestamp - replayLastFrameAt < REPLAY_FRAME_DURATION) return;

            replayLastFrameAt = timestamp;
            replayFrameIndex++;
            if (replayFrameIndex >= lastShotReplay.length) {
                finishReplay();
                return;
            }
            applyReplayFrame(lastShotReplay[replayFrameIndex]);
        }

        function finishReplay() {
            if (replayRestoreFrame) {
                balls = replayRestoreFrame.balls;
                whiteBall = replayRestoreFrame.whiteBall;
                freeBallTarget = replayRestoreFrame.freeBallTarget;
                nominatedColor = replayRestoreFrame.nominatedColor;
            }
            replayRestoreFrame = null;
            isReplaying = false;
            replayFrameIndex = 0;
            replayLastFrameAt = 0;
            showMessage(replayRestoreMessage);
            updateUI();
            syncLetPlayPanel();
        }

        function updateReplayButton() {
            const button = document.getElementById('replayBtn');
            if (!button) return;
            button.disabled = isReplaying || lastShotReplay.length < 2 ||
                ballMoving || !allBallsStopped || isAnyBallMoving();
            button.textContent = isReplaying ? '回放中...' : '回放上一杆';
        }

        function detectFirstBallHitAlongWhitePath(startX, startY, endX, endY) {
            if (!shotStarted || firstBallHit || !whiteBall) return;

            const dx = endX - startX;
            const dy = endY - startY;
            const a = dx * dx + dy * dy;
            if (a <= 0) return;

            const collisionDistance = BALL_RADIUS * 2;
            let earliestBall = null;
            let earliestT = Infinity;

            for (const ball of balls) {
                if (ball === whiteBall) continue;

                const fx = startX - ball.x;
                const fy = startY - ball.y;
                const b = 2 * (fx * dx + fy * dy);
                const c = fx * fx + fy * fy - collisionDistance * collisionDistance;
                const discriminant = b * b - 4 * a * c;
                if (discriminant < 0) continue;

                const sqrtDiscriminant = Math.sqrt(discriminant);
                const t1 = (-b - sqrtDiscriminant) / (2 * a);
                const t2 = (-b + sqrtDiscriminant) / (2 * a);
                const t = t1 >= 0 ? t1 : t2;

                if (t >= 0 && t <= 1 && t < earliestT) {
                    earliestT = t;
                    earliestBall = ball;
                }
            }

            if (earliestBall) {
                firstBallHit = earliestBall;
            }
        }

        function ballCollision(b1, b2) {
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < BALL_RADIUS * 2) {
                if (shotStarted && !firstBallHit) {
                    if (b1 === whiteBall) firstBallHit = b2;
                    else if (b2 === whiteBall) firstBallHit = b1;
                }

                const overlap = BALL_RADIUS * 2 - dist;
                const nx = dx / dist;
                const ny = dy / dist;

                b1.x -= nx * overlap / 2;
                b1.y -= ny * overlap / 2;
                b2.x += nx * overlap / 2;
                b2.y += ny * overlap / 2;

                const dvx = b1.vx - b2.vx;
                const dvy = b1.vy - b2.vy;
                const dvn = dvx * nx + dvy * ny;

                if (dvn > 0) {
                    playBallCollisionSound(dvn);
                    b1.vx -= dvn * nx;
                    b1.vy -= dvn * ny;
                    b2.vx += dvn * nx;
                    b2.vy += dvn * ny;

                    if (!shotSpinApplied && (b1 === whiteBall || b2 === whiteBall)) {
                        applyCueSpinAfterFirstCollision();
                    }
                }
            }
        }

        function applyCueSpinAfterFirstCollision() {
            if (!whiteBall || shotSpinApplied) return;
            const followVelocity = activeShotSpinY * activeShotSpeed * TOP_SPIN_STRENGTH;
            whiteBall.vx += Math.cos(activeShotAngle) * followVelocity;
            whiteBall.vy += Math.sin(activeShotAngle) * followVelocity;
            whiteBall.sideSpin = activeShotSpinX;
            shotSpinApplied = true;
        }

        function isSpotOccupied(x, y) {
            const tolerance = BALL_DIAMETER - 0.1;
            for (const ball of balls) {
                const dx = ball.x - x;
                const dy = ball.y - y;
                if (Math.sqrt(dx * dx + dy * dy) < tolerance) {
                    return true;
                }
            }
            return false;
        }

        function respotColorBall(ball) {
            if (ball.type !== 'color') return;
            const spotX = ball.defaultX;
            const spotY = ball.defaultY;

            if (!isSpotOccupied(spotX, spotY)) {
                ball.x = spotX;
                ball.y = spotY;
                ball.vx = 0;
                ball.vy = 0;
                balls.push(ball);
                return;
            }

            const colorSpots = COLOR_BALLS_DEF
                .map(cb => ({ x: cb.defaultX, y: cb.defaultY, points: cb.points }))
                .sort((a, b) => b.points - a.points);

            for (const spot of colorSpots) {
                if (!isSpotOccupied(spot.x, spot.y)) {
                    ball.x = spot.x;
                    ball.y = spot.y;
                    ball.vx = 0;
                    ball.vy = 0;
                    balls.push(ball);
                    return;
                }
            }

            const centerY = TABLE_HEIGHT / 2;
            const topCushionX = TABLE_WIDTH - BORDER - BALL_RADIUS;
            for (let x = ball.defaultX; x <= topCushionX; x += 1) {
                if (!isSpotOccupied(x, centerY)) {
                    ball.x = x;
                    ball.y = centerY;
                    ball.vx = 0;
                    ball.vy = 0;
                    balls.push(ball);
                    return;
                }
            }
            for (let x = ball.defaultX; x >= BORDER + BALL_RADIUS; x -= 1) {
                if (!isSpotOccupied(x, centerY)) {
                    ball.x = x;
                    ball.y = centerY;
                    ball.vx = 0;
                    ball.vy = 0;
                    balls.push(ball);
                    return;
                }
            }

            ball.x = ball.defaultX;
            ball.y = TABLE_HEIGHT / 2;
            ball.vx = 0;
            ball.vy = 0;
            balls.push(ball);
        }

        function getNextFinalColor() {
            const colorOrder = ['黄球', '绿球', '棕球', '蓝球', '粉球', '黑球'];
            for (const name of colorOrder) {
                const ball = balls.find(b => b.name === name && b.type === 'color');
                if (ball) return ball;
            }
            return null;
        }

        function processShotResult() {
            const context = shotContext || captureShotContext();
            const pottedWhite = pottedThisShot.find(ball => ball.type === 'white');
            const pottedReds = pottedThisShot.filter(ball => ball.type === 'red');
            const pottedColors = pottedThisShot.filter(ball => ball.type === 'color');
            const pottedFreeBall = context.freeBallTarget && pottedThisShot.includes(context.freeBallTarget);
